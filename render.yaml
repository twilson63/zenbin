services:
  - type: web
    runtime: node
    name: zenbin
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: BASE_URL
        value: https://zenbin.org
      - key: LMDB_PATH
        value: /var/data/zenbin.lmdb
      - key: VIDEO_STORAGE_PATH
        value: /var/data/videos
      - key: MAX_PAYLOAD_SIZE
        value: 524288
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: ZENBIN_JWT_SECRET
        value: change-me-in-production
      - key: SUBDOMAIN_BASE_DOMAIN
        value: zenbin.org
    disk:
      name: zenbin-data
      mountPath: /var/data
      sizeGB: 1
